# Juniper on the LAN NAS. From the repo root:
#   docker compose -f deploy/nas/docker-compose.yml up -d --build
# Then open http://192.168.1.137:8080  and  http://192.168.1.137:8080/plan
services:
  juniper:
    build:
      context: ../..
      dockerfile: deploy/nas/Dockerfile
    image: juniper-trip:local
    container_name: juniper
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "8080"
      OPENCHARGEMAP_KEY: ${OPENCHARGEMAP_KEY:-}
